apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-node-deployment
  labels:
    app: auth-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-node
  template:
    metadata:
      labels:
        app: auth-node
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: omnimart-workload-identity-sa
      securityContext:
        runAsNonRoot: true
      containers:
      - name: auth-node
        image: acromnimart4863.azurecr.io/omnimart-auth:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: DB_HOST
          value: "mysql-auth-db.mysql.database.azure.com"
        - name: DB_USER
          value: "id-omnimart-auth-db"
        - name: DB_NAME
          value: "omnimart_auth"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /api/auth/healthz
            port: 3001
          initialDelaySeconds: 20
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-node-svc
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: auth-node
