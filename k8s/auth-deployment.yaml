apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimart-auth
  labels:
    app: omnimart-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnimart-auth
  template:
    metadata:
      labels:
        app: omnimart-auth
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: omnimart-workload-identity-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: auth-node
          image: REPLACE_WITH_ACR_NAME.azurecr.io/omnimart-auth:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: omnimart-auth
  ports:
    - port: 3001
      targetPort: 3001
