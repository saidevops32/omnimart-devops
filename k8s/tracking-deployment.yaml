apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimart-tracking
  labels:
    app: omnimart-tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnimart-tracking
  template:
    metadata:
      labels:
        app: omnimart-tracking
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: tracking-erlang
          image: REPLACE_WITH_ACR_NAME.azurecr.io/omnimart-tracking:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
spec:
  type: ClusterIP
  selector:
    app: omnimart-tracking
  ports:
    - port: 8081
      targetPort: 8081
