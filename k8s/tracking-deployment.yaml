apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-erlang-deployment
  labels:
    app: tracking-erlang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracking-erlang
  template:
    metadata:
      labels:
        app: tracking-erlang
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: tracking-erlang
        image: acromnimart4863.azurecr.io/omnimart-tracking:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "150m"
        livenessProbe:
          httpGet:
            path: /api/tracking/healthz
            port: 8090
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-erlang-svc
spec:
  type: ClusterIP
  ports:
  - port: 8090
    targetPort: 8090
  selector:
    app: tracking-erlang
