apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimart-catalog
  labels:
    app: omnimart-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnimart-catalog
  template:
    metadata:
      labels:
        app: omnimart-catalog
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: omnimart-workload-identity-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: catalog-node
          image: REPLACE_WITH_ACR_NAME.azurecr.io/omnimart-catalog:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  type: ClusterIP
  selector:
    app: omnimart-catalog
  ports:
    - port: 3002
      targetPort: 3002
