apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimart-checkout
  labels:
    app: omnimart-checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnimart-checkout
  template:
    metadata:
      labels:
        app: omnimart-checkout
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: omnimart-workload-identity-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: checkout-java
          image: REPLACE_WITH_ACR_NAME.azurecr.io/omnimart-checkout:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
spec:
  type: ClusterIP
  selector:
    app: omnimart-checkout
  ports:
    - port: 8080
      targetPort: 8080
