apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-java-deployment
  labels:
    app: checkout-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-java
  template:
    metadata:
      labels:
        app: checkout-java
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: checkout-java
        image: acromnimart4863.azurecr.io/omnimart-checkout:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "384Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/checkout/healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-java-svc
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: checkout-java
