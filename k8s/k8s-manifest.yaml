# --- Checkout Service (Node.js) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimart-checkout
  namespace: default
  labels:
    app: omnimart-checkout
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnimart-checkout
  template:
    metadata:
      labels:
        app: omnimart-checkout
    spec:
      containers:
      - name: checkout-node
        image: acromnimart4863.azurecr.io/omnimart-checkout:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgrespassword"
        - name: DB_NAME
          value: "omnimart_checkout"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: omnimart-checkout
  ports:
  - port: 3000
    targetPort: 3000
    name: http
---
# --- Tracking Service (Erlang Cowboy WebSocket / HTTP) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimart-tracking
  namespace: default
  labels:
    app: omnimart-tracking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnimart-tracking
  template:
    metadata:
      labels:
        app: omnimart-tracking
    spec:
      containers:
      - name: tracking-erlang
        image: acromnimart4863.azurecr.io/omnimart-tracking:latest
        ports:
        - containerPort: 8090
          name: http
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/tracking/healthz
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: omnimart-tracking
  ports:
  - port: 8081
    targetPort: 8090
    name: http-ws
---
# --- Web Frontend (React / Nginx) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimart-web
  namespace: default
  labels:
    app: omnimart-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omnimart-web
  template:
    metadata:
      labels:
        app: omnimart-web
    spec:
      containers:
      - name: web-react
        image: acromnimart4863.azurecr.io/omnimart-web:latest
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 150m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: omnimart-web
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
# --- Ingress ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnimart-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 8080
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8080
      - path: /api/catalog
        pathType: Prefix
        backend:
          service:
            name: catalog-service
            port:
              number: 5000
      - path: /api/checkout
        pathType: Prefix
        backend:
          service:
            name: checkout-service
            port:
              number: 3000
      - path: /api/tracking
        pathType: Prefix
        backend:
          service:
            name: tracking-service
            port:
              number: 8081
