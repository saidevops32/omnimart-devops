apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimart-web
  labels:
    app: omnimart-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omnimart-web
  template:
    metadata:
      labels:
        app: omnimart-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: web-react
          image: REPLACE_WITH_ACR_NAME.azurecr.io/omnimart-web:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
spec:
  type: ClusterIP
  selector:
    app: omnimart-web
  ports:
    - port: 8080
      targetPort: 8080
