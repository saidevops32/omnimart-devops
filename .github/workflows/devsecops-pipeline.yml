name: Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AZURE_RESOURCE_GROUP: "rg-omnimart-devsecops"
  AKS_CLUSTER_NAME: "aks-omnimart-cluster"
  ACR_NAME: "acromnimart4863" # Set to your ACR name in Cloud Shell
  IMAGE_TAG: ${{ github.sha }}

jobs:
  static-security-gates:
    name: "Gate 1-4: Linters, SAST, SCA & IaC Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate 1: Hadolint (Dockerfile Linting)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: error
          ignore: DL3018

      - name: Gate 2a: Gitleaks (Secret Detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate 2b: Semgrep (SAST Code Scan)
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --error --exclude="*.test.js" .

      - name: Gate 3: Trivy Filesystem (Open Source SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

      - name: Gate 4: Checkov (IaC Kubernetes Security)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: true

  build-and-deploy:
    name: "Gate 5-7: Build, SBOM, Push & AKS Deployment"
    needs: [static-security-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Syft (SBOM Generator)
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Images Locally
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/omnimart-auth:${{ env.IMAGE_TAG }} services/auth-node
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/omnimart-catalog:${{ env.IMAGE_TAG }} services/catalog-node
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/omnimart-checkout:${{ env.IMAGE_TAG }} services/checkout-java
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/omnimart-tracking:${{ env.IMAGE_TAG }} services/tracking-erlang
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/omnimart-web:${{ env.IMAGE_TAG }} apps/web-react

      - name: Gate 5a: Generate CycloneDX SBOMs
        run: |
          syft ${{ env.ACR_NAME }}.azurecr.io/omnimart-auth:${{ env.IMAGE_TAG }} -o cyclonedx-json > sbom-auth.json
          syft ${{ env.ACR_NAME }}.azurecr.io/omnimart-catalog:${{ env.IMAGE_TAG }} -o cyclonedx-json > sbom-catalog.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom-reports
          path: sbom-*.json

      - name: Gate 5b: Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_NAME }}.azurecr.io/omnimart-auth:${{ env.IMAGE_TAG }}
          severity: 'CRITICAL'
          exit-code: '0'

      - name: Gate 6: Push Verified Images to ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-auth:${{ env.IMAGE_TAG }}
          docker tag ${{ env.ACR_NAME }}.azurecr.io/omnimart-auth:${{ env.IMAGE_TAG }} ${{ env.ACR_NAME }}.azurecr.io/omnimart-auth:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-auth:latest

          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-catalog:${{ env.IMAGE_TAG }}
          docker tag ${{ env.ACR_NAME }}.azurecr.io/omnimart-catalog:${{ env.IMAGE_TAG }} ${{ env.ACR_NAME }}.azurecr.io/omnimart-catalog:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-catalog:latest

          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-checkout:${{ env.IMAGE_TAG }}
          docker tag ${{ env.ACR_NAME }}.azurecr.io/omnimart-checkout:${{ env.IMAGE_TAG }} ${{ env.ACR_NAME }}.azurecr.io/omnimart-checkout:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-checkout:latest

          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-tracking:${{ env.IMAGE_TAG }}
          docker tag ${{ env.ACR_NAME }}.azurecr.io/omnimart-tracking:${{ env.IMAGE_TAG }} ${{ env.ACR_NAME }}.azurecr.io/omnimart-tracking:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-tracking:latest

          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-web:${{ env.IMAGE_TAG }}
          docker tag ${{ env.ACR_NAME }}.azurecr.io/omnimart-web:${{ env.IMAGE_TAG }} ${{ env.ACR_NAME }}.azurecr.io/omnimart-web:latest
          docker push ${{ env.ACR_NAME }}.azurecr.io/omnimart-web:latest

      - name: Gate 7: Deploy Manifests to AKS
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Apply Kubernetes Manifests
        run: |
          # Substitute ACR name in manifests dynamically
          sed -i "s/REPLACE_WITH_ACR_NAME/${{ env.ACR_NAME }}/g" k8s/*.yaml
          kubectl apply -f k8s/
